<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Education</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🎓</div>
                Smart Education
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <button class="mobile-menu-toggle">☰</button>
        </div>
    </nav>

    <!-- Registration Form -->
    <section class="section">
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Join Smart Education and start learning today</p>
                </div>

                <form id="register-form" onsubmit="handleRegisterForm(event)">
                    <div class="form-group">
                        <label class="form-label" for="reg-first-name">First Name</label>
                        <input type="text" id="reg-first-name" class="form-input" placeholder="John" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-last-name">Last Name</label>
                        <input type="text" id="reg-last-name" class="form-input" placeholder="Doe" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-role">I want to</label>
                        <select id="reg-role" class="form-select">
                            <option value="student">Learn (Student)</option>
                            <option value="teacher">Teach (Instructor)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-confirm-password">Confirm Password</label>
                        <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Create Account
                    </button>
                </form>

                <div class="form-footer">
                    <p>Already have an account? <a href="login.html">Sign in here</a></p>
                </div>

                <div style="margin-top: 30px; padding: 20px; background: var(--gray-50); border-radius: var(--radius); font-size: 0.9rem; color: var(--gray-600);">
                    <p style="margin-bottom: 10px; font-weight: 600; color: var(--gray-800);">By signing up, you agree to:</p>
                    <ul style="padding-left: 20px; line-height: 1.8;">
                        <li>Our Terms of Service</li>
                        <li>Privacy Policy</li>
                        <li>Community Guidelines</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Smart Education. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
