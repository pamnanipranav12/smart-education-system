<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Smart Education</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-page="courses">

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🎓</div>
                Smart Education
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html" class="active">Courses</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" class="btn btn-primary">Get Started</a></li>
            </ul>
            <button class="mobile-menu-toggle">☰</button>
        </div>
    </nav>

    <!-- Page Header -->
    <section style="background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: var(--white); padding: 60px 0;">
        <div class="container text-center">
            <h1 style="font-size: 2.5rem; margin-bottom: 15px;">Explore Our Courses</h1>
            <p style="font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: 0 auto;">
                Discover a wide range of courses designed to help you learn new skills and advance your career.
            </p>
        </div>
    </section>

    <!-- Filters -->
    <section class="section" style="padding: 30px 0; background: var(--white); border-bottom: 1px solid var(--gray-200);">
        <div class="container">
            <div class="d-flex gap-3 align-center" style="flex-wrap: wrap;">
                <div style="flex: 1; min-width: 250px;">
                    <input type="text" id="search-input" class="form-input" placeholder="Search courses...">
                </div>
                <div style="min-width: 200px;">
                    <select id="filter-category" class="form-select" onchange="filterCourses()">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div style="min-width: 200px;">
                    <select id="filter-level" class="form-select" onchange="filterCourses()">
                        <option value="">All Levels</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="filterCourses()">Filter</button>
            </div>
        </div>
    </section>

    <!-- Courses Grid -->
    <section class="section">
        <div class="container">
            <div id="courses-message" style="display: none;" class="alert alert-info text-center mb-3">
                Loading courses...
            </div>
            <div class="course-grid" id="courses-grid">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Smart Education. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Load categories
            const response = await getCategories();
            if (response.success && response.data) {
                const categorySelect = document.getElementById('filter-category');
                response.data.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    categorySelect.appendChild(option);
                });
            }

            // Load courses
            filterCourses();
        });
    </script>
</body>
</html>
